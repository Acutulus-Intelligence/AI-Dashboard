<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Dashboard helps teams connect databases and create AI-driven visualizations in seconds." />
    <title>AI Dashboard - From Database to Insights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong palette. Must mirror THEME_STORAGE_KEY in features/store/ThemeContext.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* storage unavailable - fall back to the light palette */
        }
      })();
    </script>
  </head>
  <body class="m-0 min-w-[320px] bg-background font-sans antialiased [button]:[-webkit-tap-highlight-color:transparent] [a]:[-webkit-tap-highlight-color:transparent]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
