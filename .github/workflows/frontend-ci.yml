name: Frontend CI

on:
  push:
    paths: ["Frontend/**"]
  pull_request:
    branches: [main]
    paths: ["Frontend/**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Frontend

      # Fails the build on high/critical advisories in the installed tree.
      # Moderate/low are still printed but do not fail.
      - name: Audit dependencies (high/critical)
        run: npm audit --audit-level=high
        working-directory: Frontend

      # Verifies that installed tarballs match what the npm registry published.
      # Advisory only: xlsx is installed from cdn.sheetjs.com, which has no
      # registry signature to verify against.
      - name: Verify registry signatures
        run: npm audit signatures
        working-directory: Frontend
        continue-on-error: true

      - name: Build
        run: npm run build
        working-directory: Frontend
